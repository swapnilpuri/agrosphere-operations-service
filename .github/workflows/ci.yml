name: Rubber tapping operations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress verify -Pintegration
      - run: python scripts/validate_collection_pins.py --snapshots target/collection-snapshots --events target/collection-events --api-responses target/collection-api
      - run: python -m unittest discover -s scripts -p 'test_contract_comparison.py'
      - run: python scripts/test_collection_projection.py
      - run: python scripts/validate_contracts.py
      - run: docker build -t agrosphere-operations-service:ci .
